name: Suggest a creator resource
description: Propose a free creator resource with source and licensing details.
title: "Resource suggestion: "
labels: []
body:
  - type: input
    id: source
    attributes:
      label: Original creator or publisher URL
      placeholder: https://
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Exact resource page URL
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: terms
    attributes:
      label: Known usage terms
      options:
        - Explicit open license linked at source
        - Free to use, redistribution not established
        - Personal use or unknown restrictions
        - Reference material only
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What this resource offers and how to access it
      description: Mention any email/signup gate, commercial-use conditions, date checked and evidence. Do not attach third-party files.
    validations:
      required: true
